<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <!-- Emblema Circular Central -->
  <g transform="translate(110, 110)">
    <!-- Círculo exterior punteado -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#15803d" stroke-width="2.5" stroke-dasharray="7 5" />

    <!-- Círculo interior verde mente claro -->
    <circle cx="0" cy="0" r="92" fill="#edf9f1" stroke="#bbf7d0" stroke-width="1.5" />

    <!-- Elementos del Ilustración -->
    <g>
      <!-- Sol -->
      <g transform="translate(0, -37)">
        <circle cx="0" cy="0" r="11" fill="#f59e0b" />
        <circle cx="0" cy="0" r="5.5" fill="#fef3c7" />
        <circle cx="0" cy="0" r="2.5" fill="#d97706" />
        <!-- Rayos de Sol -->
        <g stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round">
          <line x1="0" y1="-16" x2="0" y2="-20" />
          <line x1="0" y1="16" x2="0" y2="20" />
          <line x1="-16" y1="0" x2="-20" y2="0" />
          <line x1="16" y1="0" x2="20" y2="0" />
          <line x1="-11" y1="-11" x2="-14" y2="-14" />
          <line x1="11" y1="-11" x2="14" y2="-14" />
          <line x1="-11" y1="11" x2="-14" y2="14" />
          <line x1="11" y1="11" x2="14" y2="14" />
        </g>
      </g>

      <!-- Pinos Izquierda -->
      <polygon points="-54,41 -34,-7 -14,41" fill="#166534" />
      <polygon points="-54,21 -34,-17 -14,21" fill="#15803d" />
      <polygon points="-38,55 -20,3 -2,55" fill="#14532d" />
      <polygon points="-38,35 -20,-7 -2,35" fill="#166534" />

      <!-- Pinos Derecha -->
      <polygon points="14,41 34,-7 54,41" fill="#166534" />
      <polygon points="14,21 34,-17 54,21" fill="#15803d" />
      <polygon points="2,55 20,3 38,55" fill="#14532d" />
      <polygon points="2,35 20,-7 38,35" fill="#166534" />

      <!-- Caserío / Casa Roja -->
      <rect x="-19" y="17" width="38" height="40" fill="#dc2626" />
      <polygon points="-27,17 0,-9 27,17" fill="#b91c1c" />
      <!-- Puerta Blanca Arqueada -->
      <path d="M-7,57 L-7,36 A 7,7 0 0,1 7,36 L7,57 Z" fill="#ffffff" />
      <!-- Ventana circular superior -->
      <circle cx="0" cy="6" r="3" fill="#fef3c7" />
    </g>
  </g>
</svg>
