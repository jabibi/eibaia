<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap');

      .brand-title {
        font-family: 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #15803d;
      }
      .brand-accent {
        fill: #dc2626;
      }
      .brand-sub {
        font-family: 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Arial, sans-serif;
        font-weight: 700;
        font-size: 13.5px;
        fill: #dc2626;
        letter-spacing: 4.5px;
      }
      .brand-tag {
        font-family: 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
        fill: #64748b;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <!-- Fondo Blanco Aislado -->
  <rect width="100%" height="100%" fill="#ffffff" fill-opacity="0" />

  <!-- Emblema Circular Central -->
  <g transform="translate(250, 175)">
    <!-- Círculo exterior punteado -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#15803d" stroke-width="2.5" stroke-dasharray="7 5" />

    <!-- Círculo interior verde mente claro -->
    <circle cx="0" cy="0" r="92" fill="#edf9f1" stroke="#bbf7d0" stroke-width="1.5" />

    <!-- Elementos del Ilustración -->
    <g>
      <!-- Sol -->
      <g transform="translate(0, -48)">
        <circle cx="0" cy="0" r="11" fill="#f59e0b" />
        <circle cx="0" cy="0" r="5.5" fill="#fef3c7" />
        <circle cx="0" cy="0" r="2.5" fill="#d97706" />
        <!-- Rayos de Sol -->
        <g stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round">
          <line x1="0" y1="-16" x2="0" y2="-20" />
          <line x1="0" y1="16" x2="0" y2="20" />
          <line x1="-16" y1="0" x2="-20" y2="0" />
          <line x1="16" y1="0" x2="20" y2="0" />
          <line x1="-11" y1="-11" x2="-14" y2="-14" />
          <line x1="11" y1="-11" x2="14" y2="-14" />
          <line x1="-11" y1="11" x2="-14" y2="14" />
          <line x1="11" y1="11" x2="14" y2="14" />
        </g>
      </g>

      <!-- Pinos Izquierda -->
      <polygon points="-54,30 -34,-18 -14,30" fill="#166534" />
      <polygon points="-54,10 -34,-28 -14,10" fill="#15803d" />
      <polygon points="-38,44 -20,-8 -2,44" fill="#14532d" />
      <polygon points="-38,24 -20,-18 -2,24" fill="#166534" />

      <!-- Pinos Derecha -->
      <polygon points="14,30 34,-18 54,30" fill="#166534" />
      <polygon points="14,10 34,-28 54,10" fill="#15803d" />
      <polygon points="2,44 20,-8 38,44" fill="#14532d" />
      <polygon points="2,24 20,-18 38,24" fill="#166534" />

      <!-- Caserío / Casa Roja -->
      <rect x="-19" y="6" width="38" height="40" fill="#dc2626" />
      <polygon points="-27,6 0,-20 27,6" fill="#b91c1c" />
      <!-- Puerta Blanca Arqueada -->
      <path d="M-7,46 L-7,25 A 7,7 0 0,1 7,25 L7,46 Z" fill="#ffffff" />
      <!-- Ventana circular superior -->
      <circle cx="0" cy="-5" r="3" fill="#fef3c7" />
    </g>
  </g>

  <!-- Tipografía del Logotipo -->
  <text x="250" y="340" text-anchor="middle" class="brand-title">Elosu<tspan class="brand-accent">E!</tspan></text>
  <text x="250" y="380" text-anchor="middle" class="brand-sub">GESTIÓN DEL HOGAR</text>
  <text x="250" y="408" text-anchor="middle" class="brand-tag">HARITZ ONDO BASERRIA</text>
</svg>
