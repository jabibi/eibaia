<svg xmlns="http://www.w3.org/2000/svg" viewBox="103 103 306 306" width="100%" height="100%">
  <!-- Ilustración Central, fondo transparente y recorte ajustado al contenido
       (a diferencia de favicon.svg, pensado como icono de app con margen de
       seguridad para el squircle/máscara adaptativa de Android). Mismo
       transform que favicon.svg — ver comentario ahí sobre la safe zone. -->
  <g transform="translate(256, 305) scale(1.9)">

    <!-- Sol con rayos (en vez del círculo/anillo plano anterior) -->
    <g stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round">
      <line x1="0" y1="-91" x2="0" y2="-95" />
      <line x1="0" y1="-61" x2="0" y2="-57" />
      <line x1="-15" y1="-76" x2="-19" y2="-76" />
      <line x1="15" y1="-76" x2="19" y2="-76" />
      <line x1="-10.6" y1="-86.6" x2="-13.4" y2="-89.4" />
      <line x1="10.6" y1="-86.6" x2="13.4" y2="-89.4" />
      <line x1="-10.6" y1="-65.4" x2="-13.4" y2="-62.6" />
      <line x1="10.6" y1="-65.4" x2="13.4" y2="-62.6" />
    </g>
    <circle cx="0" cy="-76" r="12" fill="#f59e0b" />
    <circle cx="0" cy="-76" r="6" fill="#fef3c7" />

    <!-- Estructura principal del edificio -->
    <rect x="-32" y="-52" width="64" height="96" rx="6" fill="#334155" />

    <!-- Cornisa plana (como en logo-home.svg) -->
    <rect x="-38" y="-59" width="76" height="7" rx="1.5" fill="#1e293b" />

    <!-- Planta superior: ventanas grises -->
    <rect x="-20" y="-44" width="14" height="14" rx="2" fill="#94a3b8" />
    <rect x="6" y="-44" width="14" height="14" rx="2" fill="#94a3b8" />

    <!-- Planta principal (Foco del hogar en azul acentuado) -->
    <rect x="-26" y="-18" width="52" height="38" rx="5" fill="#0284c7" />

    <!-- Ventanas iluminadas -->
    <rect x="-18" y="-11" width="14" height="24" rx="2.5" fill="#fef08a" stroke="#ffffff" stroke-width="1.5" />
    <rect x="4" y="-11" width="14" height="24" rx="2.5" fill="#fef08a" stroke="#ffffff" stroke-width="1.5" />

    <!-- Planta baja y portal -->
    <rect x="-32" y="28" width="64" height="16" fill="#475569" />
    <rect x="-11" y="30" width="22" height="14" rx="3" fill="#ffffff" />
    <rect x="-9" y="32" width="18" height="12" rx="2" fill="#e2e8f0" />
    <line x1="0" y1="32" x2="0" y2="44" stroke="#0284c7" stroke-width="1.6" />
    <circle cx="-3" cy="38" r="1.1" fill="#0284c7" />
    <circle cx="3" cy="38" r="1.1" fill="#0284c7" />
    <circle cx="0" cy="26" r="2.3" fill="#f59e0b" />
  </g>
</svg>
