<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Máscara de icono adaptativo Android (Squircle) -->
    <clipPath id="appSquircle">
      <rect x="0" y="0" width="512" height="512" rx="116" ry="116" />
    </clipPath>

    <!-- Fondo limpio y moderno -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <!-- Degradados fluidos del río (Ibaia) en la base -->
    <linearGradient id="riverGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="riverGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <g clip-path="url(#appSquircle)">
    <!-- Fondo base -->
    <rect width="512" height="512" fill="url(#bgGrad)" />

    <!-- Olas orgánicas fluidas en la parte inferior (Representando el río Ibaia) -->
    <path d="M 0,380 C 120,360 220,410 340,380 C 420,360 480,390 512,375 L 512,512 L 0,512 Z" fill="url(#riverGrad1)" opacity="0.3" />
    <path d="M 0,420 C 150,400 280,450 512,410 L 512,512 L 0,512 Z" fill="url(#riverGrad2)" opacity="0.85" />

    <!-- Gráfico central: ESCALADO AUMENTADO (De 1.35 a 2.1) Y CENTRADO -->
    <g transform="translate(256, 215) scale(2.1)">

      <!-- Sol / Ícono superior minimalista -->
      <circle cx="0" cy="-78" r="12" fill="#f59e0b" />
      <circle cx="0" cy="-78" r="6" fill="#fef3c7" />

      <!-- Estructura principal del edificio -->
      <rect x="-32" y="-52" width="64" height="96" rx="6" fill="#334155" />
      <path d="M -36,-52 L 36,-52 L 30,-60 L -30,-60 Z" fill="#1e293b" />

      <!-- Planta Uno (Foco principal del hogar en azul acentuado) -->
      <rect x="-26" y="-18" width="52" height="38" rx="5" fill="#0284c7" />

      <!-- Ventanas grandes e iluminadas -->
      <rect x="-18" y="-11" width="14" height="24" rx="2.5" fill="#fef08a" />
      <rect x="4" y="-11" width="14" height="24" rx="2.5" fill="#fef08a" />

      <!-- Planta baja y puerta de entrada simplificada -->
      <rect x="-32" y="28" width="64" height="16" fill="#475569" />
      <rect x="-10" y="30" width="20" height="14" rx="3" fill="#ffffff" />
      <line x1="0" y1="30" x2="0" y2="44" stroke="#0284c7" stroke-width="1.8" />
    </g>
  </g>
</svg>
